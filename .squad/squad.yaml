# Configuração da squad — lida pelo Console e pelo workflow squad-agent
nome: Agentic Data Squad
cliente: RGM Tech
descricao: Template de squad agêntica de Data Analytics
plataforma: agnostico        # agnostico | databricks | snowflake | bigquery | fabric
modelo: sonnet               # sonnet | opus | haiku (ou id completo do modelo)
max_turnos: 60               # limite de turnos por execução de agente
alerta_custo_usd: 5          # o console destaca execuções acima deste valor
console_bot: ''               # login do bot do GitHub App do Squad Console (ex.: squad-console[bot]); preenchido pelo console

# Acesso dos agentes aos dados (opcional). Guia: docs/acesso-dados.md
# Configure pelo Squad Console → Configuração → Acesso a dados (testa antes de salvar).
# Credenciais ficam nos segredos do GitHub Actions, nunca aqui.
dados:
  plataforma: ''               # databricks | snowflake | bigquery | fabric
  conexao: {}                  # campos da plataforma (host, conta, projeto, servidor…), sem segredos
  leitura: []                  # bancos ou banco.schema que os agentes podem ler (ex.: [vendas, crm.silver])
  escrita: ''                  # sandbox onde os agentes podem escrever: banco.schema ou lista (ex.: [dev.bronze, dev.silver, dev.gold])
  dbt: false                   # true: o workflow instala o dbt e gera o profiles.yml (perfil "squad")
