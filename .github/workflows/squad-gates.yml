name: squad-gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:   # acionado pelo squad-agent após cada execução de agente

jobs:
  harness:
    name: Harness (validadores, gates, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint dos workflows (actionlint)
        run: |
          pip install -q actionlint-py
          actionlint

      - name: Harness protegido (branches de feature não mudam as regras)
        if: startsWith(github.head_ref || github.ref_name, 'squad/')
        run: python scripts/proteger_harness.py verificar "origin/${{ github.base_ref || 'main' }}"

      # PR pronto para produção (fora de rascunho): todas as tarefas precisam estar encerradas
      - name: G3 — tarefas encerradas
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && startsWith(github.head_ref, 'squad/')
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python scripts/check_spec.py --g3 "${HEAD_REF#squad/}"

      - name: Validadores do tipo da squad (.squad/tipo.yaml)
        run: python scripts/gates.py

      - name: Testes
        run: pytest -q

      # Só no repositório-template: cada tipo de squad é instanciado e validado
      - name: Tipos de squad do template
        if: hashFiles('tipos/base.yaml') != ''
        run: python scripts/testar_tipos.py

  # PLATAFORMA: adicione aqui o deploy para dev/homologação após merge e,
  # para produção, um job com `environment: producao` exigindo aprovação manual (G3).
